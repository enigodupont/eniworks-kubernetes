apiVersion: v1
kind: ServiceAccount
metadata:
  name: diun
  namespace: diun
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: diun
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - watch
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: diun
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: diun
subjects:
  - kind: ServiceAccount
    name: diun
    namespace: diun
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: diun
  name: diun
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diun
  template:
    metadata:
      labels:
        app: diun
      annotations:
        diun.enable: "true"
    spec:
      serviceAccountName: diun
      containers:
        - name: diun
          image: crazymax/diun:latest
          imagePullPolicy: Always
          args: ["serve"]
          env:
            - name: TZ
              value: "America/Chicago"
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_JSON
              value: "true"
            - name: DIUN_WATCH_WORKERS
              value: "20"
            - name: DIUN_WATCH_SCHEDULE
              value: "0 1 * * *"
            - name: DIUN_WATCH_JITTER
              value: "30s"
            - name: DIUN_PROVIDERS_KUBERNETES
              value: "true"
            - name: DIUN_PROVIDERS_KUBERNETES_WATCHBYDEFAULT
              value: "true"
            # Mail sends an event each, kinda sucks
            # - name: DIUN_NOTIF_MAIL_HOST
            #   value: "mail.eniworks.net.internal"
            # - name: DIUN_NOTIF_MAIL_PORT
            #   value: "25"
            # - name: DIUN_NOTIF_MAIL_FROM
            #   value: "diun@eniworks.net"
            # - name: DIUN_NOTIF_MAIL_TO
            #   value: "juramir@protonmail.com"
            # - name: DIUN_NOTIF_MAIL_INSECURESKIPVERIFY
            #   value: "true"
            # - name: DIUN_NOTIF_MAIL_SSL
            #   value: "false"
          volumeMounts:
            - mountPath: "/data"
              name: "data"
      restartPolicy: Always
      volumes:
        # Set up a data directory for diun
        # For production usage, you should consider using PV/PVC instead(or simply using storage like NAS)
        # For more details, please see https://kubernetes.io/docs/concepts/storage/volumes/
        - name: "data"
          persistentVolumeClaim:
            claimName: diun
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: diun
  namespace: diun
  labels:
    app: diun
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: freenas-iscsi-csi
  resources:
    requests:
      storage: 1Gi
